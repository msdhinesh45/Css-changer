<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Changer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Change the CSS pf below Image! With the help of the Sliders</h1>
        <span class="heading">JavaScript</span>

        <div class="css-controller">
            <label for="base">Base Color</label>
            <input type="color" name="base" id="base" value="#ff0000">

            <label for="width">Width</label>
            <input type="range" name="width" id="width" min="0" max="100" value="69" data-sizzing="%">

            <label for="border-radius">Border-Radius</label>
            <input type="range" name="border-radius" id="border-radius" min="0" max="100" value="9" data-sizzing="px">

            <label for="padding">padding</label>
            <input type="range" name="padding" id="padding" min="5" max="100" value="0" data-sizzing="px">

            <label for="blur">Blur</label>
            <input type="range" name="blur" id="blur" min="0" max="25" value="0" data-sizzing="px">
        </div>

        <img src="https://cdn.pixabay.com/photo/2021/10/10/20/33/mehtab-bagh-6698669_960_720.jpg"  alt="Image from pixaby">
    </div>    
</body>
</html>

<script src="script.js"></script>
